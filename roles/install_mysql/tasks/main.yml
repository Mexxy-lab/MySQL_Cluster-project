- name: Wait for Galera master to become Primary
  shell: >
    mysql -uroot
    -S {{ socket }}
    -Nse "SHOW STATUS LIKE 'wsrep_cluster_status';"
  register: galera_cluster_status
  retries: 90
  delay: 2
  until: "'Primary' in galera_cluster_status.stdout"
  changed_when: false
  when:
    - ansible_distribution_major_version >= "7"
    - inventory_hostname == groups['master'][0]
  tags: configure_mysql

- name: Wait for Galera master to become Synced and ready
  shell: >
    mysql -uroot
    -S {{ socket }}
    -Nse "SELECT
    (SELECT VARIABLE_VALUE FROM information_schema.GLOBAL_STATUS
     WHERE VARIABLE_NAME='wsrep_local_state_comment'),
    (SELECT VARIABLE_VALUE FROM information_schema.GLOBAL_STATUS
     WHERE VARIABLE_NAME='wsrep_ready');"
  register: galera_master_ready
  retries: 90
  delay: 2
  until:
    - "'Synced' in galera_master_ready.stdout"
    - "'ON' in galera_master_ready.stdout"
  changed_when: false
  when:
    - ansible_distribution_major_version >= "7"
    - inventory_hostname == groups['master'][0]
  tags: configure_mysql

- name: enable mysql sid service - 2
  service: name={{lc_sid}} state=started enabled=yes
  when: (ansible_distribution_major_version < "7")
  tags: configure_mysql

