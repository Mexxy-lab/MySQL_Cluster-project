# Galera SST
# IMPORTANT:
# rsync is not safe for this installation because InnoDB redo logs are stored
# outside the datadir:
#   datadir = /db/p/offbzii/v3/table/{{ sid }}
#   innodb_log_group_home_dir = /db/p/offbzii/v2/archlog/{{ sid }}/INNODB
#
# MariaDB 10.6 wsrep_sst_rsync has a known problem with this layout.
# mariabackup correctly handles the external InnoDB redo directory.
- name: Configure Galera SST method to mariabackup
  lineinfile:
    path: "{{ db_os_user_homedir }}/{{ sid }}/cfg/my_{{sid}}.cnf"
    regexp: '^\s*wsrep_sst_method\s*='
    line: 'wsrep_sst_method=mariabackup'
    state: present
  notify: restart mysql
  tags: configure_mysql


