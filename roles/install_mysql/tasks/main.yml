---
# Configure MySQL Installation Playbook Role: install
# This Role Does: Install MySQL Database Server.
# the tasks in this role are grouped in tags: prechecks, ux_users, ux_settings, server, configure, backup
# You can always issolate and run/execute one or a combination of these tags thus:
# SHELL> ansible-playbook example.yml --tags "prechecks"
# OR - combining multiple tags:
# SHELL> ansible-playbook example.yml --tags "prechecks,ux_users"
# OR - skip certain tags:
# SHELL> ansible-playbook example.yml --skip-tags "prechecks,backup"

# include encrypted variables file
- include_vars: "vars/admin_db_users_info.yml"

# Ensure that all notify runs even if tasks fail.
- name: flushing handlers
  meta: flush_handlers

# Lets Start with the prechecks tags: prechecks ascertain the variables entered/specified are both valid and acceptable.
# Any outliers in variable values will terminate play.
# tags: prechecks
- name: Terminate execution if the MySQL Variant isn't one of the following - MariaDB, Percona, Oracle-MySQL
  fail: msg="INVALID MYSQL SERVER VARIANT - Specified Variant is {{ mysql_variant }} and valid options are - {{ accepted_mysql_variants }}."
  when:  mysql_variant|lower  not in accepted_mysql_variants|lower
  tags: prechecks

- name: Terminate execution if the MySQL version is not provided
  fail: msg="mysql version NOT Specified - valid versions are - {{ accepted_mysql_variant_version }}."
  when: (mysql_variant_version is not defined ) or (  mysql_variant_version == None)
  tags: prechecks

- name: Terminate execution if the MySQL variant is not provided
  fail: msg="mysql variant NOT Specified - valid variants are - {{ accepted_mysql_variants }}."
  when: (mysql_variant is not defined ) or (  mysql_variant == None)
  tags: prechecks

- name: Terminate execution if the SID is not provided
  fail: msg="SID NOT Specified."
  when: (sid is not defined ) or (  sid == None)
  tags: prechecks

- name: Terminate execution if the MySQL Variant is Oracle-MySQL/Percona and mysql_variant_version not one of  8.0,5.7,5.6,5.5,latest.
  fail: msg="INVALID mysql version - Specified Version is {{ mysql_variant_version }} and valid versions are - {{ accepted_mysql_variant_version }}."
  when:  (mysql_variant|lower in 'percona' and  mysql_variant_version  not in accepted_mysql_variant_version) or (mysql_variant|lower in 'oracle-mysql' and  mysql_variant_version   not in accepted_mysql_variant_version)
  tags: prechecks

- name: Terminate execution if the MySQL Variant is MariaDB and mysql_variant_version not one of  10.0,10.1,10.2,10.3,latest.
  fail: msg="INVALID MariaDB version - Specified Version is {{ mysql_variant_version }} and valid versions are - {{ accepted_mariadb_variant_version }}."
  when:  (mysql_variant|lower in 'mariadb' and  mysql_variant_version  not in accepted_mariadb_variant_version)
  tags: prechecks

# We allow this to fail if the group does not exist.
- name: Check if group - dba exists
  action: shell grep  -P   '\b{{ dbadmin_group }}\b' /etc/group
  register: group_exist1
  ignore_errors: True
  tags: prechecks

- name: Check if group - {{ dbadmin_group }} exists
  action: shell /usr/bin/getent group {{ dbadmin_group }}
  register: group_exist2
  when: ( group_exist1.rc  != 0  )
  ignore_errors: True
  tags: prechecks

# Allow this to fail if the user does not exist.
- name: Check if user - db_os_user exists
  action: shell grep  -P   '\b{{ db_os_user }}\b' /etc/passwd
  register: user_exist
  ignore_errors: True
  tags: prechecks

- name: Terminate execution if db os user is not specified
  fail: msg="Database User not specified - please specify a value for variable db_os_user."
  when: ( db_os_user is not defined ) or  ( db_os_user == None )
  tags: prechecks

- name: Terminate execution if db_os_user_basedir is not specified
  fail: msg="db_os_user_basedir not specified - please specify a value for variable db_os_user_basedir."
  when: ( db_os_user_basedir is not defined ) or  ( db_os_user_basedir == None )
  tags: prechecks

- name: set db_os_user_homedir
  set_fact: db_os_user_homedir={{ db_os_user_basedir }}/v1/admin
  when: ( db_os_user_homedir is not defined ) or  ( db_os_user_homedir == None )
  tags:
    - ux_users
    - systemd_service

- name: set db_os_user_homedir
  set_fact: db_os_user_homedir={{ db_os_user_homedir }}/v1/admin
  when: ('/v1/admin' not in db_os_user_homedir)
  tags:
    - ux_users
    - systemd_service

- name: create db_os_user_homedir directory
  file: path={{ db_os_user_homedir }}  state=directory  mode=0755
  tags: ux_users

# Add group 'dbadmin_group'
- name: Add the group - dba without a specific gid
  action: group name={{ dbadmin_group }}  state=present
  when:
    - group_exist2.rc is defined
    - group_exist2.rc != 0

# Add user 'db_os_user'
- name: Add the user - db_os_user without a specific uid - trial run 1
  action: user name={{ db_os_user }} comment="DBA OS USER"    home={{ db_os_user_homedir }} shell="/bin/bash"  group={{ dbadmin_group }}
  when: ( user_exist.rc  != 0  )
  tags: ux_users

# Set the db os user home dir to {{ db_os_user_homedir }}/v1/admin
- name: create db_os_user_homedir directory
  file: path={{ db_os_user_homedir }}  state=directory owner={{ db_os_user }} group={{ dbadmin_group }} mode=0755
  tags: ux_users

- name: create db_os_user ssh directory
  file: path={{ db_os_user_homedir }}/.ssh  state=directory owner={{ db_os_user }} group={{ dbadmin_group }} mode=0700 recurse=yes
  tags: ux_users

- name: create db_os_user .tmp directory
  file: path={{ db_os_user_homedir }}/.tmp  state=directory owner={{ db_os_user }} group={{ dbadmin_group }} mode=0755
  tags: ux_users

- name: create db_os_user base directory
  file: path={{ db_os_user_basedir }}  state=directory owner={{ db_os_user }} group={{ dbadmin_group }} mode=0755
  when: ( db_os_user_basedir is defined ) or  ( db_os_user_basedir != None )
  tags: ux_users

# tags: configure_mysql
- name: set sid to uppercase.
  set_fact: sid={{ sid|upper }}
  when: ( sid is defined ) or  ( sid != None )
  tags:
    - configure_mysql
    - systemd_service

- name: set datadir.
  set_fact: datadir={{db_os_user_basedir }}/v3/table/{{ sid }}
  when: ( sid != None )
  tags:
    - ux_users
    - systemd_service

- name: set datadir.
  set_fact: datadir={{db_os_user_basedir }}/v3/table/mysql
  when:
    - ( sid != None )
    - ( deploy_using_ck_dir_structure != 'no' )
  tags: ux_users

- name: set db_os_user_base_data_dir if unset
  set_fact: db_os_user_base_data_dir={{ datadir }}
  when: ( db_os_user_base_data_dir is not defined ) or  ( db_os_user_base_data_dir == None )
  tags: ux_users

- name: create db_os_user data directory
  file: path={{ db_os_user_base_data_dir }}  state=directory owner={{ db_os_user }} group={{ dbadmin_group }} mode=0755
  when: ( db_os_user_base_data_dir is defined ) or  ( db_os_user_base_data_dir != None )
  tags: ux_users

# Make sure sub-file & sub-directory permissions for key directories are set to user db_os_user
- name: Ensure File ownership in key directories are set to user db_os_user
  shell: "chown -R {{ db_os_user }}:{{ dbadmin_group }}  {{ item }}"
  with_items:
    - "{{ db_os_user_base_data_dir }}"
    - "{{ db_os_user_basedir }}"
    - "{{ db_os_user_homedir }}"
  tags: ux_users

## enable crontab for mysql instance owner
- name: Check that the /etc/cron.allow exists
  stat: path=/etc/cron.allow
  register: cron_allow_stat_result
  tags: ux_users

- name: Check that the /etc/cron.deny exists
  stat: path=/etc/cron.deny
  register: cron_deny_stat_result
  tags: ux_users

- name: Check that db_os_user is not denied access to cron services
  lineinfile:
    dest: /etc/cron.deny
    regexp: '^{{ db_os_user }}'
    state: absent
  when: cron_deny_stat_result.stat.exists  == True
  tags: ux_users

- name: Check that db_os_user is allowed access to cron services
  lineinfile:
    dest: /etc/cron.allow
    regexp: '^{{ db_os_user }}'
    state: present
    line: '{{ db_os_user }}'
  when: cron_allow_stat_result.stat.exists  == True
  tags: ux_users

# tags: ux_settings

# Deploy the System ulimits File
- name: deploy MySQL user Open-Files Limits File
  template: src=limits.conf
    dest=/etc/security/limits.d/mysql.conf
    owner=root group=root mode=0644
  tags: ux_settings

- name: set sid to lowercase.
  set_fact: lc_sid={{ sid|lower }}
  when: ( sid is defined ) or  ( sid != None )
  tags:
    - configure_mysql
    - systemd_service


# Install Perl modules
# - name: install perl-MIME-Lite package centos 6.x and lower
#   yum: name=perl-MIME-Lite state=installed
#   tags: ux_settings

- name: Set UTC timezone
  file: src=/usr/share/zoneinfo/{{ timezone }}  dest=/etc/localtime state=link force=yes
  notify: restart crond
  tags: ux_settings

# tags: install_mysql
- name: set mysql_variant to lowercase.
  set_fact: mysql_variant_lc={{ mysql_variant|lower }}
  tags:
    - install_mysql
    - systemd_service

- name: set mysql_variant_version to lowercase.
  set_fact: mysql_variant_version_lc={{ mysql_variant_version|lower }}
  tags:
    - install_mysql
    - systemd_service

- name: set populate_ckadmin_db to lowercase.
  set_fact: populate_ckadmin_db_lc="{{ populate_ckadmin_db | lower }}"
  tags: install_mysql

- name: set deploy_admin_db to lowercase.
  set_fact: deploy_admin_db_lc="{{ deploy_admin_db | lower }}"
  tags: install_mysql

- debug:
    msg: System deploy_admin_db_lc has value {{ deploy_admin_db_lc }}

- debug:
    msg: System populate_ckadmin_db_lc has value {{ populate_ckadmin_db_lc }}

- name: set multi_vars booleans.
  set_fact:
    is_mysql80: "{{mysql_variant_version_lc == '8.0'}}"
    is_mysql57: "{{mysql_variant_version_lc == '5.7'}}"
    is_mysql56: "{{mysql_variant_version_lc == '5.6'}}"
    is_mysql55: "{{mysql_variant_version_lc == '5.5'}}"
    is_mysql51: "{{mysql_variant_version_lc == '5.1'}}"
    is_latest:  "{{mysql_variant_version_lc == 'latest'}}"
    is_mariadb: "{{mysql_variant_lc == 'mariadb'}}"
    is_mariadb10: "{{'10' in mysql_variant_version_lc }}"
    is_percona: "{{mysql_variant_lc == 'percona'}}"
    is_oracle_mysql: "{{mysql_variant_lc == 'oracle-mysql'}}"
    is_opsdb: "{{ deploy_admin_db_lc == True }}"
    to_populate_ckadmin: "{{ populate_ckadmin_db_lc == True }}"
  tags:
    - install_mysql

- name: set multi_vars booleans 1.
  set_fact:
    mysql_variant_version: 8.0
  when:
    - is_percona|bool and true
    - is_latest|bool and true
  tags:
    - install_mysql

# Enable requisite repo for Percona MySQL Server Starts #
- name: enable percona repository I
  ini_file: dest=/etc/yum.repos.d/percona.repo
            section=ps-80-release-$basearch
            option=enabled
            value=1
  when:
    - (deploy_default_repo)
    - (is_mysql80|bool and true) or (is_latest|bool and true)
  tags: install_mysql

# Enable requisite repo for Percona MySQL Server Ends #

# Enable repo for oracle community mysql server starts: #
- name: enable oracle community mysql repository
  ini_file: dest=/etc/yum.repos.d/oracle_mysql.repo
            section=mysql-community
            option=enabled
            value=1
  when:
    - (deploy_default_repo) # is_true_deploy_default_repo|bool and true
    - is_oracle_mysql|bool and true
  tags: install_mysql
# Enable repo for oracle community mysql server Ends: #

- name: Install MySQL Packages for RHEL - Percona MySQL Server 8.0/latest
  yum: name={{ item }} state=present
  with_items:
    - percona-server-client
    - percona-server-server
    - percona-server-shared
    - percona-server-devel
  when:
    - is_percona|bool and true
    - (is_mysql80|bool and true) or (is_latest|bool and true)
  tags: install_mysql

- name: Install MySQL Packages for RHEL - Percona MySQL Server 5.7
  yum: name={{ item }} state=present
  with_items:
    - Percona-Server-client-57
    - Percona-Server-server-57
    - Percona-Server-shared-57
    - Percona-Server-devel-57
  when:
    - is_percona|bool and true
    - (is_mysql57|bool and true)
  tags: install_mysql

- name: Install MySQL Packages for RHEL - Percona MySQL Server 5.6
  yum: name={{ item }} state=present
  with_items:
    - Percona-Server-client-56
    - Percona-Server-server-56
    - Percona-Server-shared-56
    - Percona-Server-devel-56
  when:
    - is_percona|bool and true
    - is_mysql56|bool and true
  tags: install_mysql

- name: Install MySQL Packages for RHEL - Percona MySQL Server 5.5
  yum: name={{ item }} state=present
  with_items:
    - Percona-Server-client-55
    - Percona-Server-server-55
    - Percona-Server-shared-55
    - Percona-Server-devel-55
  when:
    - is_percona|bool and true
    - is_mysql55|bool and true
  tags: install_mysql

- name: create staging directory to hold percona 5.1 rpm binaries
  file: path=/tmp/rpm_staging_dir  state=directory owner=root group=root mode=0755
  when:
    - is_percona|bool and true
    - is_mysql51|bool and true
  tags: configure_mysql

- name: Download Percona 5.1 rpm files
  shell: "cd /tmp/rpm_staging_dir &&  wget -r -l 1 -nd -A rpm -R '*devel*,*debuginfo*'  http://www.percona.com/redir/downloads/Percona-Server-5.1/Percona-Server-5.1.58-12.9/RPM/rhel6/x86_64/"
  when:
    - is_percona|bool and true
    - is_mysql51|bool and true
  tags: install_mysql
  ignore_errors: True

- name: Install MySQL Packages for RHEL - Percona MySQL Server 5.1
  yum: name={{ item }} state=present
  with_items:
    - /tmp/rpm_staging_dir/Percona-Server-shared-51-5.1.58-rel12.9.271.rhel6.x86_64.rpm
    - /tmp/rpm_staging_dir/Percona-Server-client-51-5.1.58-rel12.9.271.rhel6.x86_64.rpm
    - /tmp/rpm_staging_dir/Percona-Server-server-51-5.1.58-rel12.9.271.rhel6.x86_64.rpm
  when:
    - is_percona|bool and true
    - is_mysql51|bool and true
  tags: install_mysql

- name: set multi_vars booleans.
  set_fact:
    mysql_variant_version: 10.1
  when:
    - is_mariadb|bool and true
    - is_latest|bool and true
  tags: install_mysql

- name: Prepare for MariaDB Install on RHEL 7.x - MariaDB 10.x or latest
  yum: name={{ item }} state=absent
  with_items:
    - mariadb-libs
  when:
    - is_mariadb|bool and true  or is_oracle_mysql|bool and true
    - (ansible_distribution_major_version >= "7")
  tags: install_mysql

- name: Prepare for MariaDB Install on RHEL 6.x - MariaDB 10.x or latest - 1
  yum: name={{ item }} state=absent
  with_items:
    - mysql-libs-5.1
  when:
    - is_mariadb|bool and true or is_oracle_mysql|bool and true
  tags: install_mysql

- name: enable Default mariadb repository
  ini_file: dest=/etc/yum.repos.d/mariadb.repo
            section=mariadb
            option=enabled
            value=1
  when:
    - (deploy_default_repo)
    - is_mariadb|bool and true
  tags: install_mysql

- name: Install MySQL Packages for RHEL - oracle community mysql server
  yum: name={{ item }} state=present
  with_items:
    - mysql-community-server
  when:
    - is_oracle_mysql|bool and true

- name: Install MariaDB Server for RHEL - MariaDB Server 10.x/latest
  yum: name={{ item }} state=present
  with_items:
    - MariaDB-server
    - MariaDB-client
    - MariaDB-devel
    - MariaDB-backup
    - MariaDB-shared
  when:
    - is_mariadb|bool and true
    - (is_mariadb10|bool and true) or (is_latest|bool and true)
  tags: install_mysql

- name: Prepare for MariaDB Install on RHEL 6.x - MariaDB 10.x or latest - 2
  yum: name={{ item }} state=present
  with_items:
    - postfix
    - cronie
    - cronie-anacron
    - crontabs
  when:
    - is_mariadb|bool and true or is_oracle_mysql|bool and true
    - ( ansible_distribution_major_version < "7")
  tags: install_mysql

- name: Prepare for MariaDB Install on RHEL 7.x - MariaDB 10.x or latest
  yum: name={{ item }} state=present
  with_items:
    - postfix
  when:
    - is_mariadb|bool and true or is_oracle_mysql|bool and true
    - (ansible_distribution_major_version >= "7")
  tags: install_mysql

# -- set up the epel repository: Starts
- name: epel-release install
  yum: name=epel-release
       enablerepo=ansible-bootstrap-epel
       state=present
  when:
    - (deploy_default_repo) # is_true_deploy_default_repo|bool and true
  tags: install_mysql

- name: epel repository enable
  ini_file: dest=/etc/yum.repos.d/epel.repo
            section=epel
            option=enabled
            value=1
  when:
    - (deploy_default_repo)
  tags: install_mysql
# -- set up the epel repository: Ends #

- name: enable percona tools repository
  ini_file: dest=/etc/yum.repos.d/percona.repo
            section=tools-release-x86_64
            option=enabled
            value=1
  tags: install_mysql

# Install QPress, Percona xtraBackup and Toolkit
- name: Install QPress, Percona xtraBackup and Toolkit
  yum:
    state: present
    name:
      - rsync
      - perl-IO-Socket-SSL
      - perl-DBD-MySQL
      - perl-Time-HiRes
      - percona-toolkit
      - qpress
      - pv
      - screen
      - curl
  tags: install_mysql

# Install  Percona xtraBackup for MySQL 8.0
- name: Install Percona xtraBackup MySQL 8.0
  yum:
    state: present
    name:
      - percona-xtrabackup-80
  when: (is_mysql80|bool and true) or (is_latest|bool and true)

# Install  Percona xtraBackup for MySQL 5.7
- name: Install Percona xtraBackup MySQL 5.7
  yum:
    state: present
    name:
      - percona-xtrabackup-24
  when: (is_mysql57|bool and true)

# Install  Percona xtraBackup for Versions of MySQl less than 5.7
- name: Install Percona xtraBackup MySQL and MariaDB
  yum:
    state: present
    name:
      - percona-xtrabackup.x86_64
  when: (is_mysql56 and true) or ( is_mysql55 and true) or (is_mysql51 and true)

- name: disable percona tools repository
  ini_file: dest=/etc/yum.repos.d/percona.repo
            section=tools-release-x86_64
            option=enabled
            value=0
  tags: install_mysql

- name: Disable default mysql(d) service
  service: name=mysql state=stopped enabled=no
  ignore_errors: True
  tags: install_mysql

- name: Disable default mysql(d) service
  service: name=mysqld state=stopped enabled=no
  ignore_errors: True
  tags: install_mysql

- name: set hostname.
  set_fact: hostname={{ansible_hostname}}
  when: ( hostname is not defined ) or  ( hostname == None )
  tags: configure_mysql

- name: set overwrite.
  set_fact: overwrite={{mysql_db_overwrite}}
  when: ( mysql_db_overwrite is  defined ) or  ( mysql_db_overwrite != None )
  tags: configure_mysql

- name: set port.
  set_fact: port={{db_port}}
  when: ( db_port is  defined ) or  ( db_port != None )
  tags: configure_mysql

- name: Get a tentative server_id for DB Server
  shell: "/bin/hostname | /usr/bin/cksum | /bin/cut -d ' ' -f1"
  register: server_id_out
  when: ( server_id is not defined ) or  ( server_id == None )
  tags: configure_mysql

- name: set server_id.
  set_fact: server_id={{ server_id_out.stdout }}
  when: ( server_id is not defined ) or  ( server_id == None )
  tags: configure_mysql

- name: set innodb_buffer_pool_tmp 1.
  set_fact: innodb_buffer_pool_tmp={{(innodb_buffer_pool_size_percent_host_mem*ansible_memtotal_mb/1000)|int}}GB
  when: ( innodb_buffer_pool_size_percent_host_mem is defined ) or  ( innodb_buffer_pool_size_percent_host_mem != None )
  tags: configure_mysql

- name: set innodb_buffer_pool_tmp 2.
  set_fact: innodb_buffer_pool_tmp={{(ansible_memtotal_mb/2)|int}}MB
  when: ( innodb_buffer_pool_tmp == '0GB' ) or   ( innodb_buffer_pool_tmp == None ) or  ( innodb_buffer_pool_tmp is not defined )
  tags: configure_mysql

- name: set innodb_buffer_pool_tmp 3.
  set_fact: innodb_buffer_pool_size={{ innodb_buffer_pool_tmp }}
  when: ( innodb_buffer_pool_size_in_Bytes is not defined ) or  ( innodb_buffer_pool_size_in_Bytes == None )
  tags: configure_mysql

- name: set innodb_buffer_pool_tmp 4.
  set_fact: innodb_buffer_pool_size={{ innodb_buffer_pool_size_in_Bytes }}
  when: ( innodb_buffer_pool_size_in_Bytes is defined and  innodb_buffer_pool_size_in_Bytes != None )
  tags: configure_mysql

# Setting MyISAM Key Buffer size
- name: set key_buffer_size_tmp 1.
  set_fact: key_buffer_size_tmp={{(key_buffer_size_percent_host_mem*ansible_memtotal_mb/1000)|int}}GB
  when: ( key_buffer_size_percent_host_mem is defined ) or  ( key_buffer_size_percent_host_mem != None )
  tags: configure_mysql

- name: set key_buffer_size_tmp 2.
  set_fact: key_buffer_size_tmp={{(ansible_memtotal_mb/4)|int}}MB
  when: ( key_buffer_size_tmp == '0GB' ) or   ( key_buffer_size_tmp == None ) or  ( key_buffer_size_tmp is not defined )
  tags: configure_mysql

- name: set key_buffer_size 1.
  set_fact: key_buffer_size={{ key_buffer_size_tmp }}
  when: ( key_buffer_size_in_Bytes is not defined ) or  ( key_buffer_size_in_Bytes == None )
  tags: configure_mysql

- name: set key_buffer_size 2.
  set_fact: key_buffer_size={{ key_buffer_size_in_Bytes }}
  when: ( key_buffer_size_in_Bytes is defined and  key_buffer_size_in_Bytes != None )
  tags: configure_mysql

- name: deploy mysql instance owner profile File
  template: src=db.owner.profile.erb
    dest={{ db_os_user_homedir }}/.profile
    owner={{ db_os_user }} group={{ dbadmin_group }} mode=0644
  tags: configure_mysql

- name: Create database owner env directory
  file: path={{ db_os_user_homedir }}/env  state=directory owner={{ db_os_user }} group={{ dbadmin_group }} mode=0755
  tags: configure_mysql

# Set out pending variables values
- name: set var log_error
  set_fact: log_error={{db_os_user_homedir}}/{{ sid }}/logs/{{sid}}_err.log
- name: set var pid_file
  set_fact: pid_file={{db_os_user_homedir}}/{{ sid }}/cfg/{{sid}}.pid
  tags: systemd_service
- name: set var socket
  set_fact: socket={{db_os_user_homedir}}/{{ sid }}/cfg/{{sid}}mysql.sock
  tags: systemd_service
- name: set var tmpdir
  set_fact: tmpdir={{db_os_user_homedir}}/{{ sid }}/tmp
- name: set var general_log_file
  set_fact: general_log_file={{db_os_user_homedir}}/{{ sid }}/logs/general.log
- name: set var slow_query_log_file
