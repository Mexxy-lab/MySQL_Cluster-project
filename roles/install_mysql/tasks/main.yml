# Add dbadmin user
- name: Add the user - dbadmin_user without a specific uid
  action: user name={{ dbadmin_user }} comment="DBA ADMIN OS USER"  createhome=yes   home={{ dbadmin_user_homedir }} shell="/bin/bash"  group={{ dbadmin_group }}
  tags: ux_users

- name: create dbadmin_user home directory
  file: path={{ dbadmin_user_homedir }}  state=directory owner={{ dbadmin_user }} group={{ dbadmin_group }} mode=0755
  tags: ux_users

- name: create dbadmin_user ssh directory
  file: path={{ dbadmin_user_homedir }}/.ssh  state=directory owner={{ dbadmin_user }} group={{ dbadmin_group }} mode=0700
  tags: ux_users

- name: Adding public key for user - {{ dbadmin_user }}
  authorized_key: user={{ dbadmin_user }}  key="{{ lookup('file', 'dbadmin_opsdb.pub') }}"
  tags: ux_users

- name: Copy {{ dbadmin_user }} private key
  copy: content="{{ dbadmin_private_key }}" dest={{ dbadmin_user_homedir }}/.ssh/id_rsa force=yes mode=0600
        owner={{ dbadmin_user }} group={{ dbadmin_group }}
  tags: ux_users

- name: Copy {{ dbadmin_user }} public key
  copy: src=dbadmin_opsdb.pub dest={{ dbadmin_user_homedir }}/.ssh/id_rsa.pub force=yes mode=0644
        owner={{ dbadmin_user }} group={{ dbadmin_group }}
  tags: ux_users

- name: Update and Validate the sudoers file before saving
  lineinfile:
    path: /etc/sudoers
    state: present
    regexp: '^dbadmin  ALL=.*'
    line: 'dbadmin  ALL= (root) NOPASSWD: /usr/local/bin/target_build_slave.sh, /usr/bin/innobackupex, /usr/local/bin/target_restore_snapshot_gcp.sh, /usr/local/bin/target_scan_binlogs.sh'
    validate: /usr/sbin/visudo -cf %s

- name: set socket file value for all mysql commands in /etc/my.cnf
  lineinfile: dest=/etc/my.cnf
              regexp="^\s*\[\s*client\s*\]\s*"
              line="[client]"
              insertbefore="^\s*\[\s*mysqld\s*\]\s*"
  tags: configure_mysql

- name: set socket file value for all mysql commands in /etc/my.cnf
  lineinfile: dest=/etc/my.cnf
              regexp="^\s*socket={{ socket }}\s*"
              line="socket={{ socket }}"
              insertafter="^\s*\[\s*client\s*\]\s*"
  tags: configure_mysql

- name: Modify my.cnf - removing unwanted system variables 1
  replace:
    path: /etc/my.cnf
    after: '\[mysqld\]'
    regexp: '^datadir.*'
    replace: ''

- name: Modify my.cnf - removing unwanted system variables 2
  replace:
    path: /etc/my.cnf
    after: '\[mysqld\]'
    regexp: '^socket.*'
    replace: ''

- name: Modify my.cnf - removing unwanted system variables 3
  replace:
    path: /etc/my.cnf
    after: '\[mysqld\]'
    regexp: '^pid-file.*'
    replace: ''

