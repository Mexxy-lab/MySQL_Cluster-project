<AuthnProviderAlias ldap ldap1>
    AuthLDAPURL ldaps://{{ ldap1 }}:636/ou=people,dc=creditkarma,dc=com?uid?sub
    AuthLDAPBindDN {{ salt['pillar.get']('admin_tools:orc_ldap_dn') }}
    AuthLDAPBindPassword {{ salt['pillar.get']('admin_tools:orc_ldap_password') }}
</AuthnProviderAlias>

<AuthnProviderAlias ldap ldap2>
    AuthLDAPURL ldaps://{{ ldap2 }}:636/ou=people,dc=creditkarma,dc=com?uid?sub
    AuthLDAPBindDN {{ salt['pillar.get']('admin_tools:orc_ldap_dn') }}
    AuthLDAPBindPassword {{ salt['pillar.get']('admin_tools:orc_ldap_password') }}
</AuthnProviderAlias>

<VirtualHost *:80>
    ServerName orchestrator.{{ salt['grains.get']('domain') }}

    RewriteEngine on

    # Send folks on over to https
    RewriteRule . https://%{HTTP_HOST}%{REQUEST_URI} [QSA,L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName orchestrator.{{ salt['grains.get']('domain') }}

    SSLEngine On
    SSLProtocol -all +TLSv1.2
    SSLCipherSuite DEFAULT:!EXP:!SSLv2:!DES:!IDEA:!SEED:+3DES
    SSLCertificateFile    "/etc/pki/tls/certs/orchestrator-cert.crt"
    SSLCertificateKeyFile "/etc/pki/tls/certs/orchestrator-cert.key"
    SSLCertificateChainFile "/etc/pki/tls/certs/orchestrator-cert.chain"

    <Location />
        AuthType Basic
        AuthName "Orchestrator UI"
        AuthBasicProvider ldap1 ldap2
        AuthzLDAPAuthoritative on
        AuthLDAPGroupAttribute uniquemember
        AuthLDAPGroupAttributeIsDN on
        Require valid-user
        Require ldap-group cn=ops,ou=groups,dc=creditkarma,dc=com

        RequestHeader unset X-Forwarded-User
        RewriteEngine On
        RewriteCond %{LA-U:REMOTE_USER} (.+)
        RewriteRule .* - [E=RU:%1,NS]
        RequestHeader set X-Forwarded-User %{RU}e
    </Location>

    ProxyPreserveHost On
    ProxyPass        / http://localhost:3000/ connectiontimeout=5 timeout=300
    ProxyPassReverse / http://localhost:3000/
</VirtualHost>
